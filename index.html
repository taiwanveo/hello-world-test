<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World - Deployment Test v2</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c);
      background-size: 400% 400%;
      animation: gradient 12s ease infinite;
      overflow: hidden;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 4rem 3rem;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.8s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 3rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 0.5rem;
    }

    .update-note {
      font-size: 1rem;
      font-weight: 600;
      color: #ffd700;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    .status {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 8px 20px;
      background: rgba(35, 213, 171, 0.3);
      border: 1px solid rgba(35, 213, 171, 0.5);
      border-radius: 999px;
      color: #23d5ab;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello World! 🌍</h1>
    <p>如果你看到這個頁面</p>
    <p>代表 GitHub → Vercel 自動部署成功了！</p>
    <p class="update-note">🚀 第二版：由 Antigravity 透過 MCP 自動更新！</p>
    <span class="status">✅ Pipeline Active</span>
  </div>
</body>
</html>
